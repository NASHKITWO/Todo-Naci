name: android

# APK dibuat otomatis: tab Actions > "android" > Run workflow, lalu unduh artefak "todo-apk".
on:
  workflow_dispatch:
    inputs:
      widget:
        description: "Sertakan widget layar utama (matikan bila build gagal di bagian widget)"
        type: boolean
        default: true
      release:
        description: "Buat tag dan rilis GitHub dari versi di package.json, lampirkan APK"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # true bila keystore tetap sudah dipasang di Settings > Secrets (lihat README, bagian "Menandatangani APK")
      SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Pasang dependensi
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::package-lock.json tidak ada: versi dependensi tidak terkunci. Jalankan npm install sekali lalu commit lockfile-nya."
            npm install --no-audit --no-fund
          fi
      - name: Uji logika dan alat build
        run: npm test
      - name: Susun www
        run: node build.js
      - name: Buat proyek Android
        run: npx cap add android
      - name: Pasang keystore tetap
        if: env.SIGNED == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KS_B64" | base64 -d > android/app/release.keystore
      - name: Sesuaikan izin, ikon, splash, widget, versi
        env:
          WIDGET: ${{ github.event_name != 'workflow_dispatch' || inputs.widget }}
        run: |
          FLAGS=""
          if [ "$WIDGET" != "true" ]; then FLAGS="--no-widget"; fi
          if [ "$SIGNED" = "true" ]; then FLAGS="$FLAGS --signing"; fi
          node tools/patch_android.js android "$(node -p "require('./package.json').version")" $FLAGS
      - name: Sinkronkan web ke Android
        run: npx cap sync android
      - name: Bangun APK rilis (tanda tangan tetap)
        if: env.SIGNED == 'true'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Bangun APK debug (tanda tangan sementara)
        if: env.SIGNED != 'true'
        working-directory: android
        run: |
          echo "::warning::Tanpa keystore tetap: APK ini ditandatangani kunci debug sementara. Pembaruan di atas versi lama bisa gagal dipasang (harus uninstall dulu = data hilang). Pasang secret keystore (lihat README)."
          ./gradlew assembleDebug --no-daemon
      - name: Tampilkan sidik jari tanda tangan
        continue-on-error: true
        run: |
          APK=$(ls android/app/build/outputs/apk/*/*.apk | head -n 1)
          "$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)/apksigner" verify --print-certs "$APK" | grep -i "SHA-256" || true
      - uses: actions/upload-artifact@v4
        with:
          name: todo-apk
          path: android/app/build/outputs/apk/*/*.apk
          if-no-files-found: error
      - name: Lampirkan APK ke rilis GitHub (tag v* atau input release)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v$(node -p "require('./package.json').version")"; fi
          APK=$(ls android/app/build/outputs/apk/*/*.apk | head -n 1)
          cp "$APK" "tuntas-harian-$TAG.apk"
          VER="${TAG#v}"
          awk -v v="## [$VER]" 'index($0, v)==1{f=1;next} /^## \[/{if(f)exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Rilis $TAG" > notes.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "${GITHUB_SHA}" --title "Tuntas Harian $TAG" --notes-file notes.md
          gh release upload "$TAG" "tuntas-harian-$TAG.apk" --clobber
