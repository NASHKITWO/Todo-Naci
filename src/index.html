<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Tuntas Harian</title>
<meta name="theme-color" content="#1b2f66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tuntas Harian">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%231b2f66'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navigasi">
    <div class="brand">
      <span class="brand-mark" id="brand-mark"></span>
      <span>Tuntas Harian</span>
    </div>
    <nav class="nav" id="nav-views" aria-label="Tampilan"></nav>
    <div id="sec-projects" hidden>
      <h2 class="side-title">Proyek</h2>
      <div class="nav" id="nav-projects"></div>
    </div>
    <div id="sec-tags" hidden>
      <h2 class="side-title">Tag</h2>
      <div class="tagcloud" id="nav-tags"></div>
    </div>
    <div class="side-card" id="side-stats"></div>
    <div class="side-settings" id="side-settings" role="group" aria-label="Tampilan dan data">
      <button class="nav-item" id="share-btn" type="button" title="Bagikan daftar yang sedang tampil"><span class="lbl">Bagikan daftar</span></button>
      <button class="nav-item" id="accent-btn" type="button" title="Ganti warna aksen"><span class="lbl">Warna aksen</span></button>
      <button class="nav-item" id="lang-btn" type="button" title="Ganti bahasa"><span class="lbl">Bahasa</span></button>
      <button class="nav-item" id="theme-btn" type="button" title="Ganti tema (t)"><span class="lbl">Tema</span></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Buka menu" aria-controls="sidebar" aria-expanded="false" type="button"></button>
      <div>
        <h1 id="view-title">Hari ini</h1>
        <div class="sub" id="view-sub"></div>
      </div>
      <button class="btn small" id="rename-btn" type="button" hidden>Ubah nama proyek</button>
      <div class="spacer"></div>
      <div class="search" id="search-box"><input id="search" type="search" placeholder="Cari tugas…  ( / )" aria-label="Cari tugas" autocomplete="off"></div>
      <button class="icon-btn" id="search-btn" aria-label="Cari tugas" aria-expanded="false" type="button"></button>
      <button class="icon-btn" id="select-btn" aria-label="Pilih banyak tugas" title="Pilih banyak (v)" aria-pressed="false" type="button"></button>
    </header>

    <div class="composer" id="composer">
    <form class="quick" id="quick" autocomplete="off">
      <input id="quick-input" placeholder="Tambah tugas…  contoh: Bayar listrik" aria-label="Tambah tugas baru" maxlength="400">
      <button class="icon-btn" id="detail-btn" type="button" aria-label="Atur detail tugas (prioritas, tanggal, proyek)" title="Atur detail tugas"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"/></svg></button>
      <button class="icon-btn" id="bulk-btn" type="button" aria-label="Tambah banyak tugas dan templat" title="Tambah banyak / templat"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
      <button class="btn primary" type="submit">Tambah</button>
    </form>
    <div class="chips-row" id="quick-chips" aria-label="Pilihan cepat tugas baru" hidden></div>
    </div>
    <section class="hero" id="hero" aria-label="Ringkasan hari ini" hidden></section>
    <nav class="week" id="week" aria-label="Pekan" hidden></nav>
    <div class="filters" id="filters" hidden></div>
    <div class="banner" id="banner" role="alert" hidden></div>
    <section id="list" aria-label="Daftar tugas"></section>
    <footer class="about-foot" id="about-foot"></footer>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Detail tugas" aria-hidden="true" inert></aside>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/app.js" defer></script>
</body>
</html>
